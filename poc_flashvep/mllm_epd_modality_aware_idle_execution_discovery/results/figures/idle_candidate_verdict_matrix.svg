<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="677"
 viewBox="0 0 1420 677" role="img" aria-labelledby="title desc">
<title id="title">Candidate dispositions for fixed-role EPD</title>
<desc id="desc">Pinned Qwen2.5-VL-7B, three H200s. Physical and historical gates did not promote a new Online method.</desc>
<rect width="1420" height="677" fill="#ffffff"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#13243a">
<text x="24" y="42" font-size="28" font-weight="700">Candidate dispositions for fixed-role EPD</text>
<text x="24" y="67" font-size="13" fill="#496078">Pinned Qwen2.5-VL-7B, three H200s. Physical and historical gates did not promote a new Online method.</text>
<rect x="24" y="85" width="1372" height="36" rx="6" fill="#1a3957"/>
<text x="36" y="108" fill="#fff" font-size="13" font-weight="700">Candidate</text>
<text x="116" y="108" fill="#fff" font-size="13" font-weight="700">Execution boundary</text>
<text x="402" y="108" fill="#fff" font-size="13" font-weight="700">Verdict</text>
<text x="690" y="108" fill="#fff" font-size="13" font-weight="700">Evidence</text>
<text x="938" y="108" fill="#fff" font-size="13" font-weight="700">Observed constraint or remaining gate</text>
<rect x="24" y="121" width="1372" height="78" fill="#f0f4f8"/>
<text x="36" y="144" font-size="14" font-weight="700" fill="#13243a">A</text>
<text x="116" y="144" font-size="14" font-weight="400" fill="#13243a">Complete image encoding on D</text>
<text x="402" y="144" font-size="14" font-weight="700" fill="#6a4b91">CONDITIONAL_PHYSICAL_SIGNAL</text>
<text x="690" y="144" font-size="14" font-weight="400" fill="#13243a">MEASURED_PHYSICAL,</text>
<text x="690" y="163" font-size="14" font-weight="400" fill="#13243a">ANALYTICAL_BOUND</text>
<text x="938" y="144" font-size="14" font-weight="400" fill="#13243a">32.2% faster encoder round, 4/4 bitwise. Untimed admission</text>
<text x="938" y="163" font-size="14" font-weight="400" fill="#13243a">interrupts Decode. Earlier E releases did not advance main</text>
<text x="938" y="182" font-size="14" font-weight="400" fill="#13243a">P handoffs in the fixed-order replay.</text>
<rect x="24" y="199" width="1372" height="78" fill="#ffffff"/>
<text x="36" y="222" font-size="14" font-weight="700" fill="#13243a">B</text>
<text x="116" y="222" font-size="14" font-weight="400" fill="#13243a">Image boundaries as LM scheduling</text>
<text x="116" y="241" font-size="14" font-weight="400" fill="#13243a">quanta</text>
<text x="402" y="222" font-size="14" font-weight="700" fill="#983f22">NO_GO_INCREMENTAL</text>
<text x="690" y="222" font-size="14" font-weight="400" fill="#13243a">HISTORICAL PHYSICAL AND</text>
<text x="690" y="241" font-size="14" font-weight="400" fill="#13243a">ONLINE</text>
<text x="938" y="222" font-size="14" font-weight="400" fill="#13243a">Matched slice-aware transport left 7 KiB median</text>
<text x="938" y="241" font-size="14" font-weight="400" fill="#13243a">difference. Hard boundaries rejected both actual generic</text>
<text x="938" y="260" font-size="14" font-weight="400" fill="#13243a">transfers in the earlier QPS4 matched cell.</text>
<rect x="24" y="277" width="1372" height="78" fill="#f0f4f8"/>
<text x="36" y="300" font-size="14" font-weight="700" fill="#13243a">C</text>
<text x="116" y="300" font-size="14" font-weight="400" fill="#13243a">D-local co-encode and LM Prefill</text>
<text x="402" y="300" font-size="14" font-weight="700" fill="#983f22">NO_GO_IDLE_OPPORTUNITY</text>
<text x="690" y="300" font-size="14" font-weight="400" fill="#13243a">HISTORICAL PHYSICAL,</text>
<text x="690" y="319" font-size="14" font-weight="400" fill="#13243a">TRACE_ANALYSIS</text>
<text x="938" y="300" font-size="14" font-weight="400" fill="#13243a">Whole local LM prefill took about 1.15 s and already</text>
<text x="938" y="319" font-size="14" font-weight="400" fill="#13243a">exceeded the longest main residual P-backed window. Joint</text>
<text x="938" y="338" font-size="14" font-weight="400" fill="#13243a">causal partial chains were not run.</text>
<rect x="24" y="355" width="1372" height="78" fill="#ffffff"/>
<text x="36" y="378" font-size="14" font-weight="700" fill="#13243a">D</text>
<text x="116" y="378" font-size="14" font-weight="400" fill="#13243a">Route a ready multimodal causal</text>
<text x="116" y="397" font-size="14" font-weight="400" fill="#13243a">prefix</text>
<text x="402" y="378" font-size="14" font-weight="700" fill="#485e77">NOT_RUN</text>
<text x="690" y="378" font-size="14" font-weight="400" fill="#13243a">TRACE_ANALYSIS</text>
<text x="938" y="378" font-size="14" font-weight="400" fill="#13243a">Exact source join shows 7/24 requests with a closed prefix</text>
<text x="938" y="397" font-size="14" font-weight="400" fill="#13243a">at least 25 ms early. Independent early LM execution and</text>
<text x="938" y="416" font-size="14" font-weight="400" fill="#13243a">safe D admission remain untested.</text>
<rect x="24" y="433" width="1372" height="78" fill="#f0f4f8"/>
<text x="36" y="456" font-size="14" font-weight="700" fill="#13243a">E</text>
<text x="116" y="456" font-size="14" font-weight="400" fill="#13243a">Merger or architecture-specific</text>
<text x="116" y="475" font-size="14" font-weight="400" fill="#13243a">injection</text>
<text x="402" y="456" font-size="14" font-weight="700" fill="#485e77">NOT_RUN</text>
<text x="690" y="456" font-size="14" font-weight="400" fill="#13243a">SOURCE, ANALYTICAL_BOUND</text>
<text x="938" y="456" font-size="14" font-weight="400" fill="#13243a">Merger relocation sends 10,240 instead of 7,168 bytes per</text>
<text x="938" y="475" font-size="14" font-weight="400" fill="#13243a">merged visual row to the consumer. Other model injection</text>
<text x="938" y="494" font-size="14" font-weight="400" fill="#13243a">layouts were not benchmarked.</text>
<rect x="24" y="511" width="1372" height="78" fill="#ffffff"/>
<text x="36" y="534" font-size="14" font-weight="700" fill="#13243a">F</text>
<text x="116" y="534" font-size="14" font-weight="400" fill="#13243a">D executes legal pre-global</text>
<text x="116" y="553" font-size="14" font-weight="400" fill="#13243a">vision windows</text>
<text x="402" y="534" font-size="14" font-weight="700" fill="#983f22">NO_GO_COMMUNICATION</text>
<text x="690" y="534" font-size="14" font-weight="400" fill="#13243a">MEASURED_PHYSICAL</text>
<text x="938" y="534" font-size="14" font-weight="400" fill="#13243a">All 21 cuts slower, best 5.9% behind E-only. Only 28/84</text>
<text x="938" y="553" font-size="14" font-weight="400" fill="#13243a">split embeddings bitwise to native, matched by the E-only</text>
<text x="938" y="572" font-size="14" font-weight="400" fill="#13243a">split-shape control.</text>
<rect x="24" y="589" width="1372" height="78" fill="#f0f4f8"/>
<text x="36" y="612" font-size="14" font-weight="700" fill="#13243a">G</text>
<text x="116" y="612" font-size="14" font-weight="400" fill="#13243a">Early visual rows&#x27; first-layer</text>
<text x="116" y="631" font-size="14" font-weight="400" fill="#13243a">QKV</text>
<text x="402" y="612" font-size="14" font-weight="700" fill="#983f22">NO_GO_INCREMENTAL</text>
<text x="690" y="612" font-size="14" font-weight="400" fill="#13243a">SOURCE, ANALYTICAL_BOUND</text>
<text x="938" y="612" font-size="14" font-weight="400" fill="#13243a">Returning all QKV costs 9,216 instead of 7,168 bytes per</text>
<text x="938" y="631" font-size="14" font-weight="400" fill="#13243a">row, with the residual and causal attention still needed</text>
<text x="938" y="650" font-size="14" font-weight="400" fill="#13243a">at P. Physical route was not run.</text>
</g>
</svg>
